syntax = "proto3";

package jobtrack.common.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/jobtrack-cst/jobtrack/gen/go/jobtrack/common/v1;commonv1";

// ResourceId holds an ID represented as a UUID string.
message ResourceId {
  string value = 1;
}

// PaginationRequest requests a page of results.
message PaginationRequest {
  int32 page_size = 1;
  string page_token = 2;
}

// PaginationResponse contains information for retrieving the next page.
message PaginationResponse {
  string next_page_token = 1;
  int64 total_count = 2;
}

// ResourceTimestamps records creation and last-update times in UTC.
message ResourceTimestamps {
  google.protobuf.Timestamp created_at = 1;
  google.protobuf.Timestamp updated_at = 2;
}
