syntax = "proto3";

package jobtrack.job_posting.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "jobtrack/common/v1/common.proto";

option go_package = "github.com/jobtrack-cst/jobtrack/gen/go/jobtrack/job_posting/v1;jobpostingv1";

// JobPostingService creates, edits, publishes and closes vacancies.
// Status flow: DRAFT -> PUBLISHED -> CLOSED. REMOVED is set only by the
// moderation.job_removed event, which also publishes job.closed.
service JobPostingService {
  // CreateJob creates a DRAFT job for the caller. Employer role only.
  // Deadline not in the future: INVALID_ARGUMENT.
  rpc CreateJob(CreateJobRequest) returns (CreateJobResponse) {
    option (google.api.http) = {
      post: "/v1/jobs"
      body: "*"
    };
  }

  // UpdateJob replaces the editable fields. Owner only.
  // Allowed in DRAFT or PUBLISHED. If PUBLISHED, publishes job.updated.
  // CLOSED or REMOVED: FAILED_PRECONDITION.
  // Deadline not in the future: INVALID_ARGUMENT.
  rpc UpdateJob(UpdateJobRequest) returns (UpdateJobResponse) {
    option (google.api.http) = {
      put: "/v1/jobs/{job_id}"
      body: "*"
    };
  }

  // PublishJob moves a DRAFT job to PUBLISHED and publishes job.published.
  // Owner only. Calls employer.GetCompanyProfile; employer not VERIFIED,
  // job not DRAFT, or deadline passed: FAILED_PRECONDITION.
  rpc PublishJob(PublishJobRequest) returns (PublishJobResponse) {
    option (google.api.http) = {
      post: "/v1/jobs/{job_id}/publish"
      body: "*"
    };
  }

  // CloseJob moves a PUBLISHED job to CLOSED and publishes job.closed.
  // Owner only. Not PUBLISHED: FAILED_PRECONDITION.
  rpc CloseJob(CloseJobRequest) returns (CloseJobResponse) {
    option (google.api.http) = {
      post: "/v1/jobs/{job_id}/close"
      body: "*"
    };
  }

  // GetJob returns one job. DRAFT and REMOVED jobs are visible only to the
  // owner and admins (NOT_FOUND for others). Also used by application for
  // the open check: open means status PUBLISHED and deadline after now.
  rpc GetJob(GetJobRequest) returns (GetJobResponse) {
    option (google.api.http) = {get: "/v1/jobs/{job_id}"};
  }

  // ListMyJobs lists the caller's jobs, newest first. Employer role only.
  rpc ListMyJobs(ListMyJobsRequest) returns (ListMyJobsResponse) {
    option (google.api.http) = {get: "/v1/employer/jobs"};
  }

  // ListJobsClosingBetween lists PUBLISHED jobs whose deadline falls in
  // [start_time, end_time). Internal only, used by deadline-reminder.
  rpc ListJobsClosingBetween(ListJobsClosingBetweenRequest) returns (ListJobsClosingBetweenResponse);
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_DRAFT = 1;
  JOB_STATUS_PUBLISHED = 2;
  JOB_STATUS_CLOSED = 3;
  JOB_STATUS_REMOVED = 4;
}

message Job {
  string job_id = 1;
  // The employer's user ID (from x-user-id when created).
  string employer_id = 2;
  string title = 3;
  string description = 4;
  string category_id = 5;
  repeated string tag_ids = 6;
  // Location name from category-tag's ListLocations.
  string location = 7;
  google.protobuf.Timestamp deadline = 8;
  JobStatus status = 9;
  jobtrack.common.v1.ResourceTimestamps timestamps = 10;
}

message CreateJobRequest {
  // Required. Empty is INVALID_ARGUMENT.
  string title = 1;
  string description = 2;
  string category_id = 3;
  repeated string tag_ids = 4;
  string location = 5;
  google.protobuf.Timestamp deadline = 6;
}

message CreateJobResponse {
  Job job = 1;
}

message UpdateJobRequest {
  string job_id = 1;
  string title = 2;
  string description = 3;
  string category_id = 4;
  repeated string tag_ids = 5;
  string location = 6;
  google.protobuf.Timestamp deadline = 7;
}

message UpdateJobResponse {
  Job job = 1;
}

message PublishJobRequest {
  string job_id = 1;
}

message PublishJobResponse {
  Job job = 1;
}

message CloseJobRequest {
  string job_id = 1;
}

message CloseJobResponse {
  Job job = 1;
}

message GetJobRequest {
  string job_id = 1;
}

message GetJobResponse {
  Job job = 1;
}

message ListMyJobsRequest {
  jobtrack.common.v1.PaginationRequest pagination = 1;
  // JOB_STATUS_UNSPECIFIED means all statuses.
  JobStatus status = 2;
}

message ListMyJobsResponse {
  repeated Job jobs = 1;
  jobtrack.common.v1.PaginationResponse pagination = 2;
}

message ListJobsClosingBetweenRequest {
  google.protobuf.Timestamp start_time = 1;
  google.protobuf.Timestamp end_time = 2;
  jobtrack.common.v1.PaginationRequest pagination = 3;
}

message ListJobsClosingBetweenResponse {
  repeated Job jobs = 1;
  jobtrack.common.v1.PaginationResponse pagination = 2;
}