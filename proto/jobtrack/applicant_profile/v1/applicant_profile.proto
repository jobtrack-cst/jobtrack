syntax = "proto3";

package jobtrack.applicant_profile.v1;

import "google/api/annotations.proto";
import "jobtrack/common/v1/common.proto";

option go_package = "github.com/jobtrack-cst/jobtrack/gen/go/jobtrack/applicant_profile/v1;applicantprofilev1";

// ApplicantProfileService manages the caller's own applicant profile.
// Runtime handlers must enforce role and ownership using authenticated metadata;
// this schema does not enforce security. Education fields, profile semantics
// and HTTP bindings are provisional pending consolidated team review.
service ApplicantProfileService {
  // CreateMyProfile derives applicant identity from authenticated metadata.
  rpc CreateMyProfile(CreateMyProfileRequest) returns (CreateMyProfileResponse) {
    option (google.api.http) = {
      post: "/v1/applicant/profile"
      body: "*"
    };
  }

  // GetMyProfile returns the caller's profile.
  rpc GetMyProfile(GetMyProfileRequest) returns (GetMyProfileResponse) {
    option (google.api.http) = {get: "/v1/applicant/profile"};
  }

  // UpdateMyProfile accepts only editable profile fields.
  rpc UpdateMyProfile(UpdateMyProfileRequest) returns (UpdateMyProfileResponse) {
    option (google.api.http) = {
      put: "/v1/applicant/profile"
      body: "*"
    };
  }

  // PutMyProfilePhoto sets or replaces the caller's profile photo. Applicant
  // role only, own profile only (NOT_FOUND if the caller has no profile).
  // At runtime, content must be 1 to 1,000,000 bytes, content_type image/jpeg
  // or image/png, and the file signature must match the type; every failure
  // is INVALID_ARGUMENT.
  rpc PutMyProfilePhoto(PutMyProfilePhotoRequest) returns (PutMyProfilePhotoResponse) {
    option (google.api.http) = {
      put: "/v1/applicant/profile/photo"
      body: "*"
    };
  }

  // GetMyProfilePhoto returns the caller's own photo. Applicant role only.
  // NOT_FOUND if the caller has no profile or no photo.
  // Protobuf JSON encodes bytes as base64.
  rpc GetMyProfilePhoto(GetMyProfilePhotoRequest) returns (GetMyProfilePhotoResponse) {
    option (google.api.http) = {get: "/v1/applicant/profile/photo"};
  }

  // GetApplicantProfileForApplication returns the profile of the applicant of
  // one application. Employer only, and only the owning employer.
  rpc GetApplicantProfileForApplication(GetApplicantProfileForApplicationRequest) returns (GetApplicantProfileForApplicationResponse) {
    option (google.api.http) = {get: "/v1/applications/{application_id}/applicant-profile"};
  }

  // GetApplicantPhotoForApplication returns that applicant's photo.
  // Same access rule.
  rpc GetApplicantPhotoForApplication(GetApplicantPhotoForApplicationRequest) returns (GetApplicantPhotoForApplicationResponse) {
    option (google.api.http) = {get: "/v1/applications/{application_id}/applicant-photo"};
  }
}

message ApplicantProfile {
  // Applicant user ID represented as a UUID string.
  string applicant_id = 1;
  string summary = 2;
  repeated Education education = 3;
  repeated string skills = 4;
  jobtrack.common.v1.ResourceTimestamps timestamps = 5;
  // True when a photo is stored. Profile reads never include the image bytes.
  bool has_photo = 6;
}

message Education {
  string institution = 1;
  string qualification = 2;
  int32 start_year = 3;
  int32 end_year = 4;
}

message CreateMyProfileRequest {
  string summary = 1;
  repeated Education education = 2;
  repeated string skills = 3;
}

message CreateMyProfileResponse {
  ApplicantProfile profile = 1;
}

message GetMyProfileRequest {}

message GetMyProfileResponse {
  ApplicantProfile profile = 1;
}

message UpdateMyProfileRequest {
  string summary = 1;
  repeated Education education = 2;
  repeated string skills = 3;
}

message UpdateMyProfileResponse {
  ApplicantProfile profile = 1;
}

message PutMyProfilePhotoRequest {
  string content_type = 1;
  // Protobuf JSON uses base64; size, type and signature are runtime checks.
  bytes content = 2;
}

message PutMyProfilePhotoResponse {
  ApplicantProfile profile = 1;
}

message GetMyProfilePhotoRequest {}

message GetMyProfilePhotoResponse {
  string content_type = 1;
  bytes content = 2;
}

message GetApplicantProfileForApplicationRequest {
  string application_id = 1;
}

message GetApplicantProfileForApplicationResponse {
  ApplicantProfile profile = 1;
}

message GetApplicantPhotoForApplicationRequest {
  string application_id = 1;
}

message GetApplicantPhotoForApplicationResponse {
  string content_type = 1;
  bytes content = 2;
}
