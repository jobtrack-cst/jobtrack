# JT-82 deadline reminder. The PingSource posts a CloudEvent to the function
# every day at 07:00 Bhutan time; the function ignores its data. INTERNAL_TOKEN
# comes from the Secret deadline-reminder-credentials (key internal-token) and
# RABBITMQ_URL from rabbitmq-credentials (key amqp-url), as for
# resume-validator; see functions/deadline-reminder/README.md.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: deadline-reminder
  labels:
    # No public route: only the PingSource and pods in the cluster can trigger a run.
    networking.knative.dev/visibility: cluster-local
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
    spec:
      # One run at a time.
      containerConcurrency: 1
      # Above the 4 minute run limit in the function.
      timeoutSeconds: 300
      containers:
        - image: jobtrack-deadline-reminder:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: deadline-reminder
            - name: HTTP_PORT
              value: "8080"
            - name: JOB_POSTING_ADDR
              value: job-posting:9090
            - name: SAVED_JOBS_ADDR
              value: saved-jobs:9090
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: amqp-url
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: deadline-reminder-credentials
                  key: internal-token
          readinessProbe:
            httpGet:
              path: /healthz
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
---
apiVersion: sources.knative.dev/v1
kind: PingSource
metadata:
  name: deadline-reminder-schedule
spec:
  schedule: "0 7 * * *"
  timezone: Asia/Thimphu
  contentType: application/json
  data: '{"trigger":"deadline-reminder"}'
  sink:
    ref:
      apiVersion: serving.knative.dev/v1
      kind: Service
      name: deadline-reminder
