# JT-86 weekly summary. The PingSource posts a CloudEvent to the function
# every Monday at 08:00 Bhutan time; the function ignores its data.
# INTERNAL_TOKEN comes from the Secret weekly-summary-credentials (key
# internal-token), and EMAIL_SENDER_URL is set at deploy time from the
# email-sender Knative Service address; see functions/weekly-summary/README.md.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: weekly-summary
  labels:
    # No public route: only the PingSource and pods in the cluster can trigger a run.
    networking.knative.dev/visibility: cluster-local
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
    spec:
      # One run at a time, so admins are not emailed twice.
      containerConcurrency: 1
      # Above the 4 minute run limit in the function.
      timeoutSeconds: 300
      containers:
        - image: jobtrack-weekly-summary:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: weekly-summary
            - name: HTTP_PORT
              value: "8080"
            - name: ANALYTICS_ADDR
              value: analytics:9090
            - name: AUTH_ADDR
              value: auth:9090
            # Replaced at deploy time with the email-sender Knative Service
            # address plus /send-email. Kourier routes by host, and the bare
            # name "email-sender" is not one of its hosts. Left unreplaced,
            # this value has no scheme, so startup fails at once.
            - name: EMAIL_SENDER_URL
              value: set-at-deploy-time
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: weekly-summary-credentials
                  key: internal-token
          readinessProbe:
            httpGet:
              path: /healthz
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
---
apiVersion: sources.knative.dev/v1
kind: PingSource
metadata:
  name: weekly-summary-schedule
spec:
  schedule: "0 8 * * 1"
  timezone: Asia/Thimphu
  contentType: application/json
  data: '{"trigger":"weekly-summary"}'
  sink:
    ref:
      apiVersion: serving.knative.dev/v1
      kind: Service
      name: weekly-summary
