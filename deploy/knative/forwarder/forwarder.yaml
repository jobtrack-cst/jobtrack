apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-validator-forwarder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resume-validator-forwarder
  template:
    metadata:
      labels:
        app: resume-validator-forwarder
    spec:
      containers:
        - name: forwarder
          image: jobtrack-rabbitmq-forwarder:local
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: amqp-url
            - name: SINK_URL
              value: http://resume-validator
            - name: FUNCTION_NAME
              value: resume-validator
            - name: EVENT_TYPES
              value: resume.uploaded
            - name: HTTP_PORT
              value: "8080"
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
