# Reference template only; this is not a production microservice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-template
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: service-template
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-template
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: service-template
          image: jobtrack-service-template:jt-19
          # Import the locally built image into k3d before deployment.
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 9090
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: service-template
            - name: GRPC_PORT
              value: "9090"
            - name: HTTP_PORT
              value: "8080"
            # Secret service-template-secrets must supply DATABASE_URL and RABBITMQ_URL.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: service-template-secrets
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: service-template-secrets
                  key: RABBITMQ_URL
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
