apiVersion: v1
kind: Service
metadata:
  name: service-template
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: service-template
  ports:
    - name: grpc
      port: 9090
      targetPort: 9090
      protocol: TCP
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
