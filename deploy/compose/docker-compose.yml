# JobTrack local development environment (JT-27).
# Run from the repo root:
#   docker compose -f deploy/compose/docker-compose.yml up -d
# See deploy/compose/README.md for stop and reset commands.

name: jobtrack

# Settings shared by every Go service. Used by the service blocks below.
x-service-env: &service-env
  RABBITMQ_URL: amqp://${RABBITMQ_USER:?set in .env}:${RABBITMQ_PASSWORD:?set in .env}@rabbitmq:5672/
  GRPC_PORT: "9090"
  HTTP_PORT: "8080"

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      # Read by postgres-init/01-create-service-databases.sh.
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:?set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web inbox
    restart: unless-stopped

  # JT-30. Ports 9090 and 8080 stay inside the Docker network.
  auth:
    build:
      context: ../..
      dockerfile: services/auth/Dockerfile
    environment:
      <<: *service-env
      SERVICE_NAME: auth
      DATABASE_URL: postgres://auth:${SERVICE_DB_PASSWORD}@postgres:5432/auth?sslmode=disable
      # Only auth and gateway get JWT_SECRET (AGENTS.md Section 9).
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # busybox wget ships with the alpine runtime image.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # JT-32. Ports 9090 and 8080 stay inside the Docker network.
  employer:
    build:
      context: ../..
      dockerfile: services/employer/Dockerfile
    environment:
      <<: *service-env
      SERVICE_NAME: employer
      # pgx reads PGPASSWORD separately; raw passwords are not URI components.
      DATABASE_URL: postgres://employer@postgres:5432/employer?sslmode=disable
      PGPASSWORD: ${SERVICE_DB_PASSWORD:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # busybox wget ships with the alpine runtime image.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # JT-33. Ports 9090 and 8080 stay inside the Docker network.
  company-verification:
    build:
      context: ../..
      dockerfile: services/company-verification/Dockerfile
    environment:
      <<: *service-env
      SERVICE_NAME: company-verification
      # pgx reads PGPASSWORD separately; raw passwords are not URI components.
      DATABASE_URL: postgres://company_verification@postgres:5432/company_verification?sslmode=disable
      PGPASSWORD: ${SERVICE_DB_PASSWORD:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # busybox wget ships with the alpine runtime image.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # JT-34. Ports 9090 and 8080 stay inside the Docker network.
  moderation:
    build:
      context: ../..
      dockerfile: services/moderation/Dockerfile
    environment:
      <<: *service-env
      SERVICE_NAME: moderation
      # pgx reads PGPASSWORD separately; raw passwords are not URI components.
      DATABASE_URL: postgres://moderation@postgres:5432/moderation?sslmode=disable
      PGPASSWORD: ${SERVICE_DB_PASSWORD:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # busybox wget ships with the alpine runtime image.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # JT-35. Ports 9090 and 8080 stay inside the Docker network.
  audit-log:
    build:
      context: ../..
      dockerfile: services/audit-log/Dockerfile
    environment:
      <<: *service-env
      SERVICE_NAME: audit-log
      # pgx reads PGPASSWORD separately; raw passwords are not URI components.
      DATABASE_URL: postgres://audit_log@postgres:5432/audit_log?sslmode=disable
      PGPASSWORD: ${SERVICE_DB_PASSWORD:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # busybox wget ships with the alpine runtime image.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # JT-36. Ports 9090 and 8080 stay inside the Docker network. analytics is
  # the first Compose service that serves an *InternalService, so only this
  # block gets INTERNAL_TOKEN: never the shared anchor or the gateway.
  analytics:
    build:
      context: ../..
      dockerfile: services/analytics/Dockerfile
    environment:
      <<: *service-env
      SERVICE_NAME: analytics
      # pgx reads PGPASSWORD separately; raw passwords are not URI components.
      DATABASE_URL: postgres://analytics@postgres:5432/analytics?sslmode=disable
      PGPASSWORD: ${SERVICE_DB_PASSWORD:?set in .env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # busybox wget ships with the alpine runtime image.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # JT-38. Ports 9090 and 8080 stay inside the Docker network.
  job-posting:
    build:
      context: ../..
      dockerfile: services/job-posting/Dockerfile
    environment:
      <<: *service-env
      SERVICE_NAME: job-posting
      # pgx reads PGPASSWORD separately; raw passwords are not URI components.
      DATABASE_URL: postgres://job_posting@postgres:5432/job_posting?sslmode=disable
      PGPASSWORD: ${SERVICE_DB_PASSWORD:?set in .env}
      # Serves JobPostingInternalService for deadline-reminder (JT-44).
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set in .env}
      # PublishJob checks verification through EmployerService (JT-57).
      EMPLOYER_ADDR: employer:9090
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # busybox wget ships with the alpine runtime image.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # JT-45. Ports 9090 and 8080 stay inside the Docker network.
  offer:
    build:
      context: ../..
      dockerfile: services/offer/Dockerfile
    environment:
      <<: *service-env
      SERVICE_NAME: offer
      # pgx reads PGPASSWORD separately; raw passwords are not URI components.
      DATABASE_URL: postgres://offer@postgres:5432/offer?sslmode=disable
      PGPASSWORD: ${SERVICE_DB_PASSWORD:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # busybox wget ships with the alpine runtime image.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # JT-46. Ports 9090 and 8080 stay inside the Docker network.
  job-search:
    build:
      context: ../..
      dockerfile: services/job-search/Dockerfile
    environment:
      <<: *service-env
      SERVICE_NAME: job-search
      # pgx reads PGPASSWORD separately; raw passwords are not URI components.
      DATABASE_URL: postgres://job_search@postgres:5432/job_search?sslmode=disable
      PGPASSWORD: ${SERVICE_DB_PASSWORD:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  messaging:
    build:
      context: ../..
      dockerfile: services/messaging/Dockerfile
    environment:
      <<: *service-env
      SERVICE_NAME: messaging
      # pgx reads PGPASSWORD separately; raw passwords are not URI components.
      DATABASE_URL: postgres://messaging@postgres:5432/messaging?sslmode=disable
      PGPASSWORD: ${SERVICE_DB_PASSWORD:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # busybox wget ships with the alpine runtime image.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # JT-47. Ports 9090 and 8080 stay inside the Docker network.
  job-alert:
    build:
      context: ../..
      dockerfile: services/job-alert/Dockerfile
    environment:
      <<: *service-env
      SERVICE_NAME: job-alert
      # pgx reads PGPASSWORD separately; raw passwords are not URI components.
      DATABASE_URL: postgres://job_alert@postgres:5432/job_alert?sslmode=disable
      PGPASSWORD: ${SERVICE_DB_PASSWORD:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # busybox wget ships with the alpine runtime image.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # JT-48. Ports 9090 and 8080 stay inside the Docker network.
  # JT-59: Resume synchronously provisions JT-61 queues/binding at startup
  # before opening listeners; this runs without the optional functions profile.
  resume:
    build:
      context: ../..
      dockerfile: services/resume/Dockerfile
    environment:
      <<: *service-env
      SERVICE_NAME: resume
      # pgx reads PGPASSWORD separately; raw passwords are not URI components.
      DATABASE_URL: postgres://resume@postgres:5432/resume?sslmode=disable
      PGPASSWORD: ${SERVICE_DB_PASSWORD:?set in .env}
      # Serves ResumeInternalService for resume-validator (JT-44).
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # busybox wget ships with the alpine runtime image.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # JT-61 transport. Validator image is supplied by its implementation task.
  resume-validator:
    profiles: [functions]
    image: ${RESUME_VALIDATOR_IMAGE:-jobtrack-resume-validator:local}
    environment:
      SERVICE_NAME: resume-validator
      HTTP_PORT: "8080"
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      RESUME_ADDR: resume:9090
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set in .env}
    depends_on:
      resume:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  resume-validator-forwarder:
    profiles: [functions]
    build:
      context: ../..
      dockerfile: cmd/rabbitmq-forwarder/Dockerfile
    environment:
      SERVICE_NAME: rabbitmq-forwarder
      HTTP_PORT: "8080"
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      SINK_URL: http://resume-validator:8080/
      FUNCTION_NAME: resume-validator
      EVENT_TYPES: resume.uploaded
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # JT-49. Ports 9090 and 8080 stay inside the Docker network.
  saved-jobs:
    build:
      context: ../..
      dockerfile: services/saved-jobs/Dockerfile
    environment:
      <<: *service-env
      SERVICE_NAME: saved-jobs
      # pgx reads PGPASSWORD separately; raw passwords are not URI components.
      DATABASE_URL: postgres://saved_jobs@postgres:5432/saved_jobs?sslmode=disable
      PGPASSWORD: ${SERVICE_DB_PASSWORD:?set in .env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  application-status:
    build:
      context: ../..
      dockerfile: services/application-status/Dockerfile
    environment:
      <<: *service-env
      SERVICE_NAME: application-status
      # pgx reads PGPASSWORD separately; raw passwords are not URI components.
      DATABASE_URL: postgres://application_status@postgres:5432/application_status?sslmode=disable
      PGPASSWORD: ${SERVICE_DB_PASSWORD:?set in .env}
      # No INTERNAL_TOKEN: application-status serves and calls no internal RPCs.
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # busybox wget ships with the alpine runtime image.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # JT-50. Ports 9090 and 8080 stay inside the Docker network.
  applicant-profile:
    build:
      context: ../..
      dockerfile: services/applicant-profile/Dockerfile
    environment:
      <<: *service-env
      SERVICE_NAME: applicant-profile
      # pgx reads PGPASSWORD separately; raw passwords are not URI components.
      DATABASE_URL: postgres://applicant_profile@postgres:5432/applicant_profile?sslmode=disable
      PGPASSWORD: ${SERVICE_DB_PASSWORD:?set in .env}
      # No INTERNAL_TOKEN: applicant-profile serves and calls no internal RPCs.
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # busybox wget ships with the alpine runtime image.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # JT-39. Ports 9090 and 8080 stay inside the Docker network. category-tag
  # never publishes or consumes events; RabbitMQ stays as in the template.
  category-tag:
    build:
      context: ../..
      dockerfile: services/category-tag/Dockerfile
    environment:
      <<: *service-env
      SERVICE_NAME: category-tag
      # pgx reads PGPASSWORD separately; raw passwords are not URI components.
      DATABASE_URL: postgres://category_tag@postgres:5432/category_tag?sslmode=disable
      PGPASSWORD: ${SERVICE_DB_PASSWORD:?set in .env}
      # Serves CategoryTagInternalService for job-alert (JT-44).
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # busybox wget ships with the alpine runtime image.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # To add a service: copy this block, uncomment it, and replace every
  # "auth" with the service name (kebab-case for the key and SERVICE_NAME,
  # snake_case in DATABASE_URL). Do not publish port 9090 to the host.
  #
  # auth:
  #   build:
  #     context: ../..
  #     dockerfile: services/auth/Dockerfile
  #   environment:
  #     <<: *service-env
  #     SERVICE_NAME: auth
  #     DATABASE_URL: postgres://auth:${SERVICE_DB_PASSWORD}@postgres:5432/auth?sslmode=disable
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy
  #   restart: unless-stopped

  application:
    build:
      context: ../..
      dockerfile: services/application/Dockerfile
    environment:
      <<: *service-env
      SERVICE_NAME: application
      # pgx reads PGPASSWORD separately; raw passwords are not URI components.
      DATABASE_URL: postgres://application@postgres:5432/application?sslmode=disable
      PGPASSWORD: ${SERVICE_DB_PASSWORD:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # JT-31. The only service published to the host (AGENTS.md Section 9).
  # No *service-env: the gateway needs no RabbitMQ login, and never INTERNAL_TOKEN.
  gateway:
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    environment:
      SERVICE_NAME: gateway
      HTTP_PORT: "8080"
      # Only auth and gateway get JWT_SECRET (AGENTS.md Section 9).
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      # All 20 public services. Routes to a service not in Compose yet return 503.
      ANALYTICS_ADDR: analytics:9090
      APPLICANT_PROFILE_ADDR: applicant-profile:9090
      APPLICATION_ADDR: application:9090
      APPLICATION_STATUS_ADDR: application-status:9090
      AUDIT_LOG_ADDR: audit-log:9090
      AUTH_ADDR: auth:9090
      CATEGORY_TAG_ADDR: category-tag:9090
      COMPANY_VERIFICATION_ADDR: company-verification:9090
      EMPLOYER_ADDR: employer:9090
      INTERVIEW_ADDR: interview:9090
      JOB_ALERT_ADDR: job-alert:9090
      JOB_POSTING_ADDR: job-posting:9090
      JOB_SEARCH_ADDR: job-search:9090
      MESSAGING_ADDR: messaging:9090
      MODERATION_ADDR: moderation:9090
      NOTIFICATION_INBOX_ADDR: notification-inbox:9090
      OFFER_ADDR: offer:9090
      RESUME_ADDR: resume:9090
      REVIEW_ADDR: review:9090
      SAVED_JOBS_ADDR: saved-jobs:9090
    ports:
      - "8000:8080"
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      # busybox wget ships with the alpine runtime image.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
