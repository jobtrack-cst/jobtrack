# SonarQube scope for the once-per-sprint local run (AGENTS.md Section 10, JT-84).
# The server URL and token are passed as environment variables, never committed.
sonar.projectKey=jobtrack
sonar.projectName=JobTrack
sonar.sourceEncoding=UTF-8

# Hand-written code: Go services, functions, gateway, shared packages, the
# RabbitMQ forwarder and the React frontend.
sonar.sources=cmd,functions,gateway,pkg,services,frontend/src
sonar.tests=cmd,functions,gateway,pkg,services,tests
sonar.exclusions=**/*_test.go,**/mocks/**,**/testdata/**,**/*.pb.go,**/*.pb.gw.go
sonar.test.inclusions=**/*_test.go,tests/e2e/**/*.cy.js

# Unit test coverage from: go test -coverprofile=coverage.out ./...
sonar.go.coverage.reportPaths=coverage.out
